<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Amsterdam';
  src: url('assets/Amsterdam.woff') format('woff');
}
@font-face {
  font-family: 'Bastliga';
  src: url('assets/Bastliga-One.woff') format('woff');
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #092015;
  color: #ebefdf;
  font-family: system-ui, sans-serif;
  padding: 40px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  max-width: 1100px;
  margin: auto;
}
.card {
  aspect-ratio: 85/55;
  background: linear-gradient(112deg, #f7f3e6, #eae4d3);
  padding: 28px;
  border-radius: 2px;
  box-shadow: 0 18px 36px -12px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.role {
  font-size: 13px;
  color: #244b35;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.name-amsterdam {
  font-family: 'Amsterdam', cursive;
  font-size: 46px;
  color: #173726;
  margin: 16px 0 6px;
  line-height: 1.1;
  text-shadow: 0 1px 0.5px #fffdf4, 0 -0.8px 0.6px rgba(18, 42, 28, 0.45);
}
.name-bastliga {
  font-family: 'Bastliga', cursive;
  font-size: 44px;
  color: #173726;
  margin: 16px 0 6px;
  line-height: 1.1;
  text-shadow: 0 1px 0.5px #fffdf4, 0 -0.8px 0.6px rgba(18, 42, 28, 0.45);
}
.focus {
  font-size: 13px;
  color: #3b5b45;
  margin-top: 4px;
}
.footer {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #1b392a;
  border-top: 1px solid #5a7b5240;
  padding-top: 12px;
}
h2 {
  font-size: 18px;
  color: #c5dcbe;
  margin-bottom: 12px;
}
</style>
</head>
<body>
<div class="grid">
  <div>
    <h2>Option A: Amsterdam Handwriting Font</h2>
    <div class="card">
      <div class="role">Software Engineer</div>
      <div class="name-amsterdam">Kwanho Kim</div>
      <div class="focus">C++ device software &amp; integration</div>
      <div class="footer">
        <span>contact@kwanho.dev</span>
        <span>Leuven, Belgium</span>
      </div>
    </div>
  </div>
  <div>
    <h2>Option B: Bastliga One Font</h2>
    <div class="card">
      <div class="role">Software Engineer</div>
      <div class="name-bastliga">Kwanho Kim</div>
      <div class="focus">C++ device software &amp; integration</div>
      <div class="footer">
        <span>contact@kwanho.dev</span>
        <span>Leuven, Belgium</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
