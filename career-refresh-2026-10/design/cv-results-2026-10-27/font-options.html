<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Playfair';
  src: url('/font/PlayfairDisplay.woff2') format('woff2');
  font-weight: 700;
}
@font-face {
  font-family: 'Syne';
  src: url('/font/Syne.woff2') format('woff2');
  font-weight: 700;
}
@font-face {
  font-family: 'Cormorant';
  src: url('/font/CormorantGaramond.woff2') format('woff2');
  font-weight: 700;
}
body { background: #e7ece5; font-family: sans-serif; padding: 40px; }
.card { background: white; padding: 30px; margin-bottom: 24px; max-width: 800px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.role { font-size: 13pt; color: #244b35; font-weight: 500; margin-top: 4px; font-family: Inter, sans-serif; }
.name-playfair { font-family: 'Playfair', serif; font-size: 32pt; font-weight: 700; color: #16261c; letter-spacing: -0.02em; }
.name-syne { font-family: 'Syne', sans-serif; font-size: 30pt; font-weight: 700; color: #16261c; letter-spacing: -0.03em; }
.name-cormorant { font-family: 'Cormorant', serif; font-size: 34pt; font-weight: 700; color: #16261c; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div class="card">
  <h2>Option A: Syne (Architectural Modernist Display)</h2>
  <div class="name-syne">Kwanho Kim</div>
  <div class="role">Software Engineer</div>
</div>
<div class="card">
  <h2>Option B: Playfair Display (Luxury Editorial Serif)</h2>
  <div class="name-playfair">Kwanho Kim</div>
  <div class="role">Software Engineer</div>
</div>
<div class="card">
  <h2>Option C: Cormorant Garamond (Classical European Craft)</h2>
  <div class="name-cormorant">Kwanho Kim</div>
  <div class="role">Software Engineer</div>
</div>
</body>
</html>
