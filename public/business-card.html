<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kwanho Kim · Business Card</title>
<style>
@font-face {
  font-family: 'Bastliga';
  src: url('/font/Bastliga-One.woff') format('woff');
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #071b13;
  color: #edf2e8;
  font-family: system-ui, -apple-system, sans-serif;
  padding: 24px;
}
.stage {
  max-width: 520px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.card {
  aspect-ratio: 85/55;
  width: 100%;
  background: linear-gradient(112deg, #f7f3e6, #eae4d3);
  padding: 24px 28px;
  border-radius: 2px;
  position: relative;
  overflow: hidden;
  color: #173726;
  box-shadow: 0 1px 0 #fffdf0, 0 3px 0 #bdc2a8, 0 5px 0 #294630, 0 20px 40px -12px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  text-align: center;
  align-items: center;
  justify-content: space-between;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url('/paper-fibres.webp') 0 0/260px, url('/paper-grain.webp') 0 0/120px;
  opacity: .55;
  mix-blend-mode: multiply;
  pointer-events: none;
}
.card::after {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid #45644724;
  box-shadow: inset 0 1px 0 #fffdf588;
  opacity: .7;
  pointer-events: none;
}
.debossed {
  text-shadow: 0 1px 0.8px #ffffff, 0 -1px 0.8px rgba(18, 42, 28, 0.45), -1px 0 0.8px rgba(18, 42, 28, 0.35);
}
.role {
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  color: #355344;
}
.name {
  font-family: 'Bastliga', cursive;
  font-size: 44px;
  line-height: 1.1;
  margin: 4px 0 2px;
  color: #173726;
}
.focus {
  font-size: 12px;
  color: #3a5b44;
  letter-spacing: 0.02em;
}
.location {
  font-size: 11px;
  color: #55725e;
  margin-top: 2px;
}
.footer {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(85, 118, 76, 0.25);
  box-shadow: inset 0 1px 0 #fffdf5c9;
  padding-top: 8px;
  font-size: 11.5px;
  color: #21432e;
}
.footer a {
  color: inherit;
  text-decoration: none;
}
.qr {
  width: 26px;
  height: 26px;
  display: block;
  opacity: 0.85;
}
body[data-theme="light"] {
  background: #f7f6f0;
  color: #14281c;
}
body[data-theme="light"] .card {
  background: linear-gradient(135deg, #133c27, #0a2416);
  border: 1px solid #2d5538;
  color: #f7f5e8;
  box-shadow: 0 1px 0 #3a6845, 0 3px 0 #1b3d27, 0 5px 0 #0d2215, 0 20px 40px -10px rgba(0, 0, 0, 0.35);
}
body[data-theme="light"] .card::before {
  mix-blend-mode: overlay;
  opacity: .35;
}
body[data-theme="light"] .role {
  color: #c4dec1;
}
body[data-theme="light"] .name {
  color: #fcfbf5;
}
body[data-theme="light"] .focus {
  color: #d8ead4;
}
body[data-theme="light"] .location {
  color: #9cb89c;
}
body[data-theme="light"] .debossed {
  text-shadow: 0 1px 0.8px #05140b, 0 -1px 0.8px rgba(165, 215, 175, 0.5), -1px 0 0.8px rgba(165, 215, 175, 0.4);
}
body[data-theme="light"] .footer {
  border-top-color: rgba(85, 140, 100, 0.4);
  box-shadow: inset 0 1px 0 rgba(140, 200, 160, 0.2);
  color: #f0f4ea;
}
body[data-theme="light"] .qr {
  filter: invert(1) hue-rotate(95deg) brightness(1.2) drop-shadow(0 0.5px 0.3px #05140b);
}
body[data-theme="light"] .toolbar button, body[data-theme="light"] .toolbar a {
  background: #ffffff;
  color: #14281c;
  border-color: #cad9c6;
}
body[data-theme="light"] .toolbar button:hover, body[data-theme="light"] .toolbar a:hover {
  background: #eef4ec;
  border-color: #8fae92;
  color: #0c2017;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.toolbar button, .toolbar a {
  background: #102d1d;
  color: #dce5cf;
  border: 1px solid #3c654b;
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: all 160ms ease;
}
.toolbar button:hover, .toolbar a:hover {
  border-color: #e6bf7d;
  color: #e6bf7d;
  background: #183d2a;
}
@media print {
  body { background: white; padding: 0; }
  .toolbar { display: none; }
  .card { box-shadow: none; border: 1px solid #ccc; width: 85mm; height: 55mm; }
}
</style>
</head>
<body>
<main class="stage">
  <div class="card" id="card">
    <div style="margin: auto 0; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
      <div class="role debossed">Software Engineer</div>
      <div class="name debossed">Kwanho Kim</div>
      <div class="focus debossed">C++ device software &amp; integration</div>
      <div class="location">Leuven, Belgium</div>
    </div>
    <div class="footer">
      <a href="mailto:contact@kwanho.dev">contact@kwanho.dev</a>
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="https://kwanho.dev" target="_blank" rel="noopener">kwanho.dev ↗</a>
        <a href="https://kwanho.dev" target="_blank" rel="noopener"><img class="qr" src="/kwanho-qr.svg" alt="kwanho.dev QR"></a>
      </div>
    </div>
  </div>

  <nav class="toolbar" aria-label="Card actions">
    <button type="button" onclick="toggleCardTheme()">Theme: Dark / Light (Forest Edge)</button>
    <button type="button" onclick="window.print()">Print Card / Save PDF</button>
    <a href="/about" target="_self">Return to portfolio</a>
  </nav>
  <script>
    function toggleCardTheme() {
      const isLight = document.body.getAttribute('data-theme') === 'light';
      document.body.setAttribute('data-theme', isLight ? 'dark' : 'light');
    }
  </script>
</main>
</body>
</html>
